[package]
name = "rove-explorer"
version = "0.4.26"
description = "A focused two-pane file explorer"
authors = ["Rove Explorer"]
edition = "2021"

[lib]
name = "rove_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
tauri-plugin-clipboard-manager = "2"
notify = "6"
trash = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "9.1.2", default-features = false, features = ["chrono", "deflate-flate2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6"
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

# Already in the tree via Tauri; used for the Finder-compatible clipboard and file-type icons.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
